[project]
name = "chatdku-public"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "docx2txt>=0.9",
    "dspy>=3.4.0",
    "llama-index>=0.14.25",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-embeddings-text-embeddings-inference>=0.6.0",
    "llama-index-readers-file>=0.7.0",
    "llama-index-vector-stores-qdrant>=0.10.3",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
]

[project.scripts]
agent = "chatdku.cli:main"
chatdku = "chatdku.cli:main"
chatdku-ingest = "chatdku.ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatdku"]
